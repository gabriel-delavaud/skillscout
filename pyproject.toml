[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscout"
version = "2.3.0"
description = "Cherche sur skills.sh les skills qui répondent à un besoin, écarte les douteux et les classe avec Jev (TypeSafe) — sans token Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "agent-skills", "security", "skills.sh"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: French",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/gabriel-delavaud/skillscout"

[project.scripts]
skillscout = "skillscout.cli:cli"

[tool.setuptools]
packages = ["skillscout"]
