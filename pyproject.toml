[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscout"
version = "2.0.0"
description = "Trie les skills de skills.sh par confiance puis par Jev (TypeSafe), et installe chaque semaine les meilleurs skills méta — sans token Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "agent-skills", "security", "skills.sh"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: French",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/gabriel-delavaud/skillscout"

[project.scripts]
skillscout = "skillscout.cli:cli"

[tool.setuptools]
packages = ["skillscout"]

[tool.setuptools.package-data]
skillscout = ["default_profile.toml"]
